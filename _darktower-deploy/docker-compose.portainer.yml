version: "3.8"

services:
  scrapegraph-server:
    build:
      context: /docker/appdata/scrapegraph
      dockerfile: Dockerfile.server
    image: scrapegraph-server:latest
    container_name: scrapegraph-server
    ports:
      - "3277:3277"
    env_file:
      - /docker/appdata/scrapegraph/.env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3277/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
